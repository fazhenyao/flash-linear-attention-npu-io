name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - "cloudflare/**"
      - "migrations/**"
      - "package.json"
      - "package-lock.json"
      - "wrangler.toml"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: "Apply remote D1 migrations before deploying"
        required: true
        type: boolean
        default: true
      deploy_worker:
        description: "Deploy Worker"
        required: true
        type: boolean
        default: true
      configure_secrets:
        description: "Configure Worker ADMIN_TOKEN and AUTH_SECRET"
        required: true
        type: boolean
        default: false
      configure_runner_secret:
        description: "Configure Worker RUNNER_TOKEN"
        required: true
        type: boolean
        default: false
      import_snapshots:
        description: "Import repository business and performance snapshots"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Validate Cloudflare config
        shell: bash
        run: |
          if grep -q "replace-with-cloudflare-d1-database-id" wrangler.toml; then
            echo "wrangler.toml still contains placeholder database_id."
            exit 1
          fi
          node --check cloudflare/worker.js
          npx wrangler --version

      - name: Apply remote D1 migrations
        if: ${{ github.event_name == 'push' || inputs.apply_migrations }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply flash-linear-attention-npu-io-fazhenyao --remote

      - name: Deploy Worker
        if: ${{ github.event_name == 'push' || inputs.deploy_worker }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Configure Worker secrets
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.configure_secrets }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FLASH_IO_ADMIN_TOKEN: ${{ secrets.FLASH_IO_ADMIN_TOKEN }}
          CLOUDFLARE_AUTH_SECRET: ${{ secrets.CLOUDFLARE_AUTH_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FLASH_IO_ADMIN_TOKEN"
          test -n "$CLOUDFLARE_AUTH_SECRET"
          printf '%s' "$FLASH_IO_ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN
          printf '%s' "$CLOUDFLARE_AUTH_SECRET" | npx wrangler secret put AUTH_SECRET

      - name: Configure Worker runner secret
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.configure_runner_secret }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FLASH_IO_RUNNER_TOKEN: ${{ secrets.FLASH_IO_RUNNER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FLASH_IO_RUNNER_TOKEN"
          printf '%s' "$FLASH_IO_RUNNER_TOKEN" | npx wrangler secret put RUNNER_TOKEN

      - name: Import repository snapshots
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.import_snapshots }}
        env:
          FLASH_IO_ADMIN_TOKEN: ${{ secrets.FLASH_IO_ADMIN_TOKEN }}
          FLASH_IO_API_BASE: https://flash-linear-attention-npu-io-fazhenyao.fazhenyao.workers.dev
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --retry 5 --retry-delay 2 "$FLASH_IO_API_BASE/api/health"
          python scripts/import_cloudflare.py --api "$FLASH_IO_API_BASE" --token "$FLASH_IO_ADMIN_TOKEN"

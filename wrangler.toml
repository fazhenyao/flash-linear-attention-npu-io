preview_urls = false

[vars]
ALLOWED_ORIGINS = "https://fazhenyao.github.io,http://127.0.0.1:8787,http://localhost:8787"

[[d1_databases]]
binding = "DB"
database_name = "flash-linear-attention-npu-io-fazhenyao"
